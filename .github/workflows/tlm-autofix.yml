name: TLM Auto-Fix

# Reusable workflow: auto-fixes blocking issues flagged by TLM review.
# Checks out the PR branch, runs Claude CLI with the issue list, commits fixes.
# After pushing, verifies whether issues are resolved. If still broken, triggers re-review.

on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to fix
        required: true
        type: string
      issues:
        description: JSON array of blocking issues from TLM review
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  auto-fix:
    name: Auto-Fix PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      actions: write

    steps:
      - name: Get PR branch
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} --jq '.head.ref')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "PR branch: $BRANCH"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for bot loop
        id: botcheck
        run: |
          LAST_AUTHOR=$(git log -1 --format='%ae')
          if [[ "$LAST_AUTHOR" == "github-actions[bot]@users.noreply.github.com" ]]; then
            echo "Last commit was from github-actions[bot] — skipping to avoid loop"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Claude auto-fix
        if: steps.botcheck.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUES: ${{ inputs.issues }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 -c "import os,sys; sys.stdout.write(os.environ['ISSUES'])" > /tmp/tlm-issues.json

          python3 -c "
          import json, os, sys
          issues = json.loads(open('/tmp/tlm-issues.json').read())
          lines = [
              'You are fixing blocking issues flagged by a TLM review on PR #' + os.environ['PR_NUMBER'] + '.',
              'Fix ALL of the following issues. Make minimal, targeted changes. Do not modify any files under .github/.',
              '',
              'ISSUES TO FIX:',
          ]
          for n, x in enumerate(issues):
              file_part = x.get('file', '') + ': ' if x.get('file') else ''
              lines.append(str(n+1) + '. [' + x['severity'] + '] ' + file_part + x['issue'])
              lines.append('   Fix: ' + x['fix'])
              lines.append('')
          lines.append('After fixing, verify each change is correct. Do not add tests or documentation unless the issue explicitly requires it.')
          open('/tmp/tlm-prompt.txt', 'w').write('\n'.join(lines))
          "

          claude --print --allowedTools "Read,Edit,Write,Bash" < /tmp/tlm-prompt.txt

      - name: Commit and push fixes
        id: commit
        if: steps.botcheck.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "fix: address TLM review blocking issues on PR #${{ inputs.pr_number }}

          Auto-fixed by TLM agent. Issues resolved:
          $(node -e "
            const i = JSON.parse(require('fs').readFileSync('/tmp/tlm-issues.json','utf8'));
            console.log(i.map(x => '- '+x.issue.slice(0,80)).join('\n'));
          ")

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin HEAD
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Verify fixes with Claude
        id: verify
        if: steps.commit.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUES: ${{ inputs.issues }}
        run: |
          export DIFF=$(git diff HEAD~1 HEAD -- ':!.github/' 2>/dev/null | head -c 8000 || echo "Diff unavailable")

          VERDICT=$(node -e "
            const https = require('https');
            const issues = JSON.parse(process.env.ISSUES || '[]');
            const diff = process.env.DIFF || '';

            const prompt = 'The following blocking issues were flagged in a TLM review:\n' +
              JSON.stringify(issues, null, 2) +
              '\n\nThis diff was applied as a fix:\n\`\`\`diff\n' + diff.slice(0, 6000) + '\n\`\`\`\n\n' +
              'Are there still unresolved blocking issues from the original list? ' +
              'Return ONLY valid JSON, no markdown: { \"still_broken\": true/false, \"summary\": \"one sentence\" }';

            const body = JSON.stringify({
              model: 'claude-sonnet-4-6',
              max_tokens: 200,
              messages: [{ role: 'user', content: prompt }]
            });

            const options = {
              hostname: 'api.anthropic.com',
              path: '/v1/messages',
              method: 'POST',
              headers: {
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(body)
              }
            };

            const req = https.request(options, res => {
              let data = '';
              res.on('data', d => data += d);
              res.on('end', () => {
                try {
                  const text = JSON.parse(data).content[0].text.trim();
                  const clean = text.replace(/^\`\`\`json?\n?/m,'').replace(/\n?\`\`\`$/m,'').trim();
                  const parsed = JSON.parse(clean);
                  console.log(JSON.stringify(parsed));
                } catch(e) {
                  console.log(JSON.stringify({ still_broken: false, summary: 'Verification inconclusive' }));
                }
              });
            });
            req.on('error', () => {
              console.log(JSON.stringify({ still_broken: false, summary: 'Verification failed' }));
            });
            req.setTimeout(30000, () => {
              req.destroy();
              console.log(JSON.stringify({ still_broken: false, summary: 'Verification timed out' }));
            });
            req.write(body);
            req.end();
          ")

          STILL_BROKEN=$(echo "$VERDICT" | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(d.still_broken ? 'true' : 'false');
          ")
          SUMMARY=$(echo "$VERDICT" | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(d.summary || '');
          ")

          echo "still_broken=$STILL_BROKEN" >> $GITHUB_OUTPUT
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Post status comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.commit.outputs.changed }}" != "true" ]]; then
            MSG="🔧 **TLM Auto-Fix:** No changes were needed — the issues may already be resolved or require human attention."
          elif [[ "${{ steps.verify.outputs.still_broken }}" == "true" ]]; then
            MSG="🔄 **TLM Auto-Fix:** Pushed partial fixes. Still broken: ${{ steps.verify.outputs.summary }}."
          else
            MSG="✅ **TLM Auto-Fix complete.** All blocking issues appear resolved. ${{ steps.verify.outputs.summary }}"
          fi
          gh pr comment ${{ inputs.pr_number }} \
            --body "$MSG" \
            --repo ${{ github.repository }}
