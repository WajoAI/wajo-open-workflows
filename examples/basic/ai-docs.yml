# .github/workflows/ai-docs.yml
# AI docs review on push to main
name: AI Docs Review

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  docs:
    uses: wajoai/wajo-open-workflows/.github/workflows/tlm-docs.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
